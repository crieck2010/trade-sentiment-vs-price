[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-sentiment-vs-price"
version = "0.1.0"
description = "Sentiment vs price analysis: lead/lag correlation, event studies, information coefficient, sentiment indicators and rule evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["trading", "sentiment-analysis", "event-study", "finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trade-sentiment-vs-price = "trade_sentiment_vs_price.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/trade-sentiment-vs-price"
Repository = "https://github.com/crieck2010/trade-sentiment-vs-price"

[tool.setuptools.packages.find]
where = ["src"]
